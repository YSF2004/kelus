name: Deploy kelus.me

# kelus.me is served by Cloudflare (wrangler.toml), not GitHub Pages. This is the only deploy.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

# One deploy at a time; a newer push replaces a deploy that has not finished, so the latest main always wins.
concurrency:
  group: deploy-kelus
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Browser tests already passed on the pull request ("Verify pull request"); running them again here doubled
      # every release to about ten minutes. Lint, types and unit tests stay as a fast guard.
      - name: Build
        run: npm run build || { echo "::warning::Build failed once; retrying"; npm run build; }
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_WAITLIST_ENDPOINT: ${{ secrets.NEXT_PUBLIC_WAITLIST_ENDPOINT }}
          NEXT_PUBLIC_QUESTIONS_ENDPOINT: ${{ secrets.NEXT_PUBLIC_QUESTIONS_ENDPOINT }}
          NEXT_PUBLIC_AI_ENDPOINT: ${{ secrets.NEXT_PUBLIC_AI_ENDPOINT }}
          NEXT_PUBLIC_MONTHLY_PAYMENT_LINK: ${{ secrets.NEXT_PUBLIC_MONTHLY_PAYMENT_LINK }}
      - name: Publish static site on kelus.me
        run: npx wrangler@4.92.0 deploy || { echo "::warning::Publish failed once; retrying"; sleep 10; npx wrangler@4.92.0 deploy; }
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # The job is green only when kelus.me actually serves this commit.
      - name: Check kelus.me serves this commit
        run: |
          want="${GITHUB_SHA:0:12}"
          for attempt in $(seq 1 20); do
            live=$(curl -fsS "https://kelus.me/version.json?ts=$(date +%s%N)" | sed -E 's/.*"id":"([^"]+)".*/\1/' || true)
            if [ "$live" = "$want" ]; then echo "kelus.me is on $live"; exit 0; fi
            echo "kelus.me is on ${live:-?}, waiting for $want ($attempt/20)"
            sleep 15
          done
          echo "::error::kelus.me did not switch to $want"
          exit 1
