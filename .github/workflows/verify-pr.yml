name: Verify pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install chromium
      # The dev server and the build fetch Google Fonts; retry once so a network blip is not a red PR.
      - name: Browser tests
        run: npm run test:e2e || { echo "::warning::Browser tests failed once; retrying"; npm run test:e2e; }
      - name: Build
        run: npm run build || { echo "::warning::Build failed once; retrying"; npm run build; }
