name: Bug report
description: Report a reproducible problem without sharing private course material.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not attach private notes, student data, credentials, or copyrighted course packs. Use a synthetic or openly licensed example."
  - type: textarea
    id: happened
    attributes:
      label: What happened?
      description: Say what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Safe steps to reproduce
      placeholder: "1. Add a synthetic PDF…\n2. Open…\n3. See…"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: "Chrome 130 on Android"
