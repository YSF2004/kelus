  </g>
  <text x="138" y="95" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600" letter-spacing="-2" fill="#12160f">kelus</text>
  <path d="M64 132h1072" stroke="#d5d9d0" stroke-width="1.5"/>
  <text x="72" y="224" font-family="Georgia, 'Times New Roman', serif" font-size="66" letter-spacing="-2.5" fill="#12160f">Revise your lessons.</text>
  <text x="72" y="299" font-family="Georgia, 'Times New Roman', serif" font-size="66" letter-spacing="-2.5" fill="#12160f">Know what to review next.</text>
  <text x="75" y="360" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#4a5246">Your notes → recall practice → a route that responds.</text>
  <g transform="translate(72 420)">
