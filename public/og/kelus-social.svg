<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Kelus — revise from your own notes</title>
  <desc id="desc">A course note becomes a recall question, then a route showing the next topic to review.</desc>
  <rect width="1200" height="630" fill="#fbfaf7"/>
  <path d="M0 0h1200v630H0z" fill="none" stroke="#d5d9d0" stroke-width="2"/>
  <g fill="none" stroke="#12160f" stroke-linecap="round" stroke-linejoin="round" stroke-width="8">
    <path d="M72 52v56"/>
