  </g>
  <path d="M386 486h57m-13-13 13 13-13 13" fill="none" stroke="#4a5246" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(462 420)">
    <rect width="296" height="132" rx="13" fill="#ffffff" stroke="#d5d9d0" stroke-width="1.5"/>
    <text x="22" y="35" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.1" fill="#4a5246">RECALL</text>
    <text x="22" y="75" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#12160f">Try it from memory.</text>
